<html lang="ro">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="author" content="Aurel Cîrlan" />
    <title>Înregistrare - Catalog GEALAN</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url('logo-bg.svg');
            background-size: 600px;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.4;
            z-index: 0;
        }

        .register-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 400px;
            width: 100%;
            backdrop-filter: blur(10px);
            position: relative;
            z-index: 1;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo-bg {
            width: 120px;
            height: 120px;
            margin: 0 auto;
        }

        .register-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .register-header h1 {
            color: #1a1a2e;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .register-header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group input::placeholder {
            color: #999;
        }

        .form-group small {
            color: #999;
            font-size: 12px;
            margin-top: 5px;
            display: block;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-link {
            background: transparent;
            color: #667eea;
            border: 2px solid #667eea;
            margin-top: 10px;
        }

        .btn-link:hover {
            background: #667eea;
            color: white;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 14px;
        }

        .success {
            background: #efe;
            color: #363;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 14px;
        }

        @media (max-width: 480px) {
            .register-container {
                padding: 30px 20px;
            }

            .register-header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="logo-section">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="120" height="120" class="logo-bg">
              <defs>
                <linearGradient id="steauaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" style="stop-color:#00205B;stop-opacity:1" />
                  <stop offset="50%" style="stop-color:#A91B1B;stop-opacity:1" />
                  <stop offset="100%" style="stop-color:#00205B;stop-opacity:1" />
                </linearGradient>
              </defs>
              <circle cx="256" cy="256" r="250" fill="url(#steauaGradient)" />
              <g fill="none" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M 100 280 Q 256 260 412 280" stroke-width="10" />
                <path d="M 120 280 L 140 180 Q 256 160 372 180 L 392 280" />
                <path d="M 160 280 Q 160 380 256 380 Q 352 380 352 280" />
                <path d="M 190 310 L 230 310" stroke-width="6" />
                <path d="M 282 310 L 322 310" stroke-width="6" />
                <path d="M 230 350 Q 256 360 282 350" stroke-width="5" />
              </g>
              <g fill="white" stroke="none">
                <text x="256" y="250" font-family="monospace" font-size="48" font-weight="bold" text-anchor="middle" fill="white">&lt;/&gt;</text>
              </g>
              <g fill="none" stroke="white" stroke-width="6" stroke-linecap="round">
                <path d="M 380 150 L 420 110 L 460 150" />
                <path d="M 420 110 L 420 200" />
              </g>
              <g fill="white" stroke="none">
                <polygon points="80,180 90,210 120,210 95,230 105,260 80,240 55,260 65,230 40,210 70,210" transform="scale(0.8) translate(50, 50)" />
              </g>
            </svg>
        </div>
        <div class="register-header">
            <h1>Înregistrare</h1>
            <p>Creează un cont pentru a accesa catalogul GEALAN</p>
        </div>

        <div id="error" class="error" hidden></div>
        <div id="success" class="success" hidden></div>

        <form id="registerForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                    placeholder="nume@exemplu.com"
                    autocomplete="email"
                />
            </div>

            <div class="form-group">
                <label for="password">Parolă</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    placeholder="•••••••••"
                    autocomplete="new-password"
                    minlength="8"
                />
                <small>Minim 8 caractere</small>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirmă parola</label>
                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    required
                    placeholder="•••••••••"
                    autocomplete="new-password"
                    minlength="8"
                />
            </div>

            <button type="submit" class="btn btn-primary">Înregistrează-te</button>
        </form>

        <div class="back-link">
            <a href="login.html">Ai deja cont? Autentifică-te</a>
        </div>
    </div>

    <script>
        // Prevent auth.js from redirecting on register page
        window.isAuthPage = true;
    </script>
    <script src="auth.js"></script>
</body>
</html>
